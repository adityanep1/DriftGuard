name: ci-infra

on:
  push:
    branches: [main]
    paths:
      - 'driftguard-infra/**'
  pull_request:
    paths:
      - 'driftguard-infra/**'

permissions:
  contents: read

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: driftguard-infra

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: pip install pytest hypothesis
      - name: Run policy tests
        run: python -m pytest policies/python -q
        working-directory: driftguard-infra

  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -fsSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest
      - name: Verify valid plan passes
        run: conftest test --all-namespaces --policy policies policies/tests/valid-plan.json
        working-directory: driftguard-infra
      - name: Verify invalid plan fails
        run: |
          if conftest test --all-namespaces --policy policies policies/tests/invalid-security-plan.json; then
            echo "Expected conftest to fail on invalid plan, but it passed"
            exit 1
          fi
        working-directory: driftguard-infra
