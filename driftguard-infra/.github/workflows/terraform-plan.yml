name: terraform-plan

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - 'policies/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - run: terraform show -json tfplan > plan.json
      - name: Install conftest
        working-directory: .
        run: |
          curl -fsSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest
      - name: Enforce plan policy
        working-directory: .
        run: |
          if command -v conftest >/dev/null 2>&1; then
            conftest test --policy policies live/${{ matrix.environment }}/plan.json
          else
            echo 'conftest is required in CI but is unavailable' >&2
            exit 1
          fi
      - name: Estimate cost impact
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Run Infracost
        working-directory: live/${{ matrix.environment }}
        run: infracost breakdown --path . --format json --out-file infracost.json
      - name: Publish plan
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Terraform plan (${{ matrix.environment }})\n\nPlan completed; inspect the workflow artifact for full JSON output.`;
            github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
