apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws
  labels:
    app.kubernetes.io/name: provider-aws
    app.kubernetes.io/part-of: driftguard
spec:
  package: xpkg.upbound.io/upbound/provider-aws:v1.15.0
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    app.kubernetes.io/name: provider-aws-config
    app.kubernetes.io/part-of: driftguard
spec:
  credentials:
    source: InjectedIdentity
