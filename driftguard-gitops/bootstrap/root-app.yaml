apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: driftguard-gitops

spec:
  project: default

  source:
    repoURL: https://github.com/adityanep1/DriftGuard.git
    targetRevision: main
    path: bootstrap/children
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 300s