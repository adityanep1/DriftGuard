apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform-addons
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: "4.19.0"
    helm:
      releaseName: falco
      values: |
        falco:
          jsonOutput: true
          httpOutput:
            enabled: true
            url: http://falcosidekick.falco.svc.cluster.local:2801
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
