apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: driftguard-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: workloads
  source:
    repoURL: https://github.com/adityanep1/DriftGuard.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
