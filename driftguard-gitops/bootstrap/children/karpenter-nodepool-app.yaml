apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: platform-addons
  source:
    repoURL: https://github.com/adityanep1/DriftGuard.git
    targetRevision: main
    # Each environment's ArgoCD targets its own overlay (dev/staging/prod). The
    # overlay sets the node IAM role and the karpenter.sh/discovery tag to match
    # that environment's cluster. Point this at the overlay for the target cluster.
    path: driftguard-gitops/addons/karpenter/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
