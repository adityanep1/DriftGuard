apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: platform-addons
  source:
    repoURL: https://github.com/your-org/driftguard-gitops.git
    targetRevision: main
    path: addons/karpenter
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
