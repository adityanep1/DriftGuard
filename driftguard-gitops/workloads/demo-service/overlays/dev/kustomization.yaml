apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
labels:
  - pairs:
      Environment: dev
    includeSelectors: false
patches:
  - target:
      kind: Ingress
      name: demo-service
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: demo-dev.example.invalid
  - target:
      kind: ServiceAccount
      name: demo-service
    patch: |
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::123456789012:role/driftguard-dev-demo-service
images:
  - name: ghcr.io/your-org/demo-service
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/driftguard-dev/demo-service
    newTag: REPLACE_WITH_COMMIT_SHA
