apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-service
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/part-of: driftguard
    Project: DriftGuard
    ManagedBy: ArgoCD
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-service
        app.kubernetes.io/part-of: driftguard
        Project: DriftGuard
        ManagedBy: ArgoCD
    spec:
      serviceAccountName: demo-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-service
          image: ghcr.io/your-org/demo-service:REPLACE_WITH_COMMIT_SHA
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: demo-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
  strategy:
    canary:
      stableService: demo-service
      canaryService: demo-service-canary
      steps:
        - setWeight: 20
        - pause:
            duration: 300s
        - analysis:
            templates:
              - templateName: demo-service-error-rate
              - templateName: demo-service-p95-latency
        - setWeight: 40
        - pause:
            duration: 300s
        - analysis:
            templates:
              - templateName: demo-service-error-rate
              - templateName: demo-service-p95-latency
        - setWeight: 60
        - pause:
            duration: 300s
        - analysis:
            templates:
              - templateName: demo-service-error-rate
              - templateName: demo-service-p95-latency
        - setWeight: 80
        - pause:
            duration: 300s
        - analysis:
            templates:
              - templateName: demo-service-error-rate
              - templateName: demo-service-p95-latency
        - setWeight: 100
        - pause:
            duration: 300s
        - analysis:
            templates:
              - templateName: demo-service-error-rate
              - templateName: demo-service-p95-latency
      abortScaleDownDelaySeconds: 30
    
