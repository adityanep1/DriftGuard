apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  # Enable only after the configured OIDC provider has been verified for an administrative operator.
  admin.enabled: "false"
  timeout.reconciliation: 180s
  timeout.reconciliation.jitter: 0s
