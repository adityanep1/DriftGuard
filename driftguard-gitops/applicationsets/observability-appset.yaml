apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: kube-prometheus-stack
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            version: "65.8.1"
            namespace: monitoring
          - name: loki
            repoURL: https://grafana.github.io/helm-charts
            chart: loki
            version: "6.6.3"
            namespace: monitoring
          - name: tempo
            repoURL: https://grafana.github.io/helm-charts
            chart: tempo
            version: "1.10.3"
            namespace: monitoring
  template:
    metadata:
      name: '{{.name}}'
      namespace: argocd
    spec:
      project: observability
      source:
        repoURL: '{{.repoURL}}'
        chart: '{{.chart}}'
        targetRevision: '{{.version}}'
        helm:
          releaseName: '{{.name}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 300s
